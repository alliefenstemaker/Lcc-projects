<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>float</title>

<style>
.container {  display: grid;
  grid-template-columns: 0.6fr 2.3fr 1.1fr;
  grid-template-rows: 1fr 1fr 1fr;
  gap: 0px 0px;
  grid-auto-flow: row;
}

.header { grid-area: 1 / 1 / 2 / 4; }
.header{
    background-color:rgb(122, 215, 236);
    width:400px; 
    color:rgb(216, 87, 108);
}

.side { grid-area: 2 / 3 / 4 / 4; }
.side{
    background-color:rgb(122, 215, 236);
    width:175px; 
    color:rgb(216, 87, 108);
}
.body2 { grid-area: 3 / 1 / 4 / 3; }

.info { grid-area: 1 / 3 / 2 / 4; }

.body { grid-area: 2 / 1 / 3 / 3; }

</style>

</head>

<body>
    <div class="container">
        <div class="header">
            <p>this is my header with some info</p>
        </div>
        <div class="side"><p>this is my side collom with diffrent info </p></div>
        <div class="body2">
            <p>This is anothor colom with some more info</p>
        </div>
        <div class="info">
            <p><a href="index.html">Home</a></p>
        </div>
        <div class="body">
            <p>This is my other body paragraph</p>
        </div>
      </div>
</body>
</html>
