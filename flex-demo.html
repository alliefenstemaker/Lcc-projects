<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>flexbox demo</title>
    <link rel="icon" type="image/png" href="favicon-old-32x32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="favicon-old-16x16.png" sizes="16x16" />
    <style>
        body {
            background-color:#afdae3;
            color: #444;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            max-width: 80%;
            margin: 0 auto;
        }

        #one {
            background-color: #023e8a;
            border: 2px solid #00b4d8;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
        }

        #one div {
            text-align: center;
            background-color: #90e0ef;
            border: 2px solid #00b4d8;
            border-radius: 10px;
            /*flex-grow: 1;*/
        }

        #two {
            background-color: #023e8a;
            border: 2px solid #00b4d8;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items:normal ;
        }

        #two div {
            text-align: center;
            background-color: #90e0ef;
            border: 2px solid #00b4d8;
            border-radius: 10px;
            flex-grow: 1;
        }

        #three {
            background-color: #023e8a;
            border: 2px solid #00b4d8;
            border-radius: 20px;
            margin-bottom: 50px;
            padding: 10px;
            display: flex;
            /*flex-direction: row;*/
            justify-content: center;
            /*align-items: stretch;*/
        }

        #three div {
            text-align: center;
            background-color: #90e0ef;
            border: 2px solid #00b4d8;
            border-radius: 10px;
            flex-grow: 1
        }
        .grow{
            flex-grow:3;
        }
    </style>
</head>

<body>
    <h2>flexbox demo setup</h2>
    <div id="one">
        <div>
            <p>one</p>
        </div>
        <div>
            <p>two</p>
        </div>
        <div>
            <p>three<br>has more text</p>
        </div>
    </div>

    <div id="two">
        <div>
            <p>one</p>
        </div>
        <div>
            <p>two</p>
        </div>
        <div>
            <p>three<br>has more text</p>
        </div>
    </div>

    <div id="three">
        <div>
            <p>one</p>
        </div>
        <div>
            <p>two</p>
        </div>
        <div>
            <p>three<br><a href="index.html">Back Home</a></li></p>
        </div>
    </div>
</body>

</html>
