<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>favicons</title>
<link rel="icon" type="image/png" href="favicon-old-32x32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="favicon-old-16x16.png" sizes="16x16" />

<style>


#one{
    width:600px;
    height:100px;
    background:rgb(108, 216, 235);
    border:5px solid rgba(82, 165, 209, 0.706);
    transition:transform 2s, background 1s;
}
#one:hover{
    transform:scale(1,2) translate(50px,100px);
    background:rgb(126, 207, 250);
}
#two{
    width:400px;
    height:400px;
    background:rgb(122, 120, 120);
    border:7px dotted beige;
    padding:20px;
    transition: transform 3s, background 2s;
}
#two:hover{
    transform:scale(.5,.25) rotate(70deg);
    background: rgb(251, 192, 64);
    border:10px dotted black
}
#three{
    width:24px;
    height:7px;
    background:rgb(82, 216, 187);
    border:10px solid rgb(164, 180, 199);
    padding:20px;
    margin:40px;
    transition: transform 3s, background 2s, border 2s, margin 2s;
}
#three:hover{
    transform:rotate(2000deg);
    background: rgb(88, 222, 146);
    border:10px solid black;
    margin:50px;
    padding:20px;
}
#four{
    width:700px;
    height:100px;
    background:rgb(216, 55, 119);
    border:7px dotted rgb(171, 28, 166);
    padding:20px;
    margin:center;
    transition: transform 3s, background 2s;
}
#four:hover{
    transform:rotate(2520deg);
    background: rgb(173, 64, 251);
    border:10px dotted black;
}
a{
    color:rgba(27, 150, 150, 0.755);
    font-weight:900;
    text-decoration:none;
    display:block;
    border:5px solid rgb(62, 183, 239);
    width:250px;
    padding:4px;

} 
a:hover{
    color:rgb(49, 216, 160);
    text-decoration:underline;
}
</style>
</head>

<body>
    <div id="one">I'm so tired</div>
<p><a href="index.html">Back Home</a></p>
</body>

<body>
    <div id="two"></div>
</body>
<body>
    <div id="three"></div>
</body>
<body>
    <div id="four">follow the box with cursor</div>
</body>

</html>
