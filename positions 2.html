<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>favicons</title>
<link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16" />

<style>
div{
    width:150px;
    height:150px;
    background-color:rgb(242, 242, 191); 
    padding:10px;
    border:3px solid rgb(116, 116, 205);
}
#one{
    position: static; 
    z-index:100;
}
#five{
    position:sticky;
    top:0px; 
    background-color: rgb(105, 105, 208);
 

}
#two{
    position:relative;
    left:100px;
    top:-30px;
    z-index:50;
}
#three{
    position:absolute;
    background: rgb(228, 143, 228);
    right:100px;
    bottom:50px;
    z-index:600;

}
#four{
position:fixed;
background:rgb(228, 143, 157);
right:30px;
top:100px; 
z-index:900;
}

</style>
</head>

<body>

    <div id="one">
    </div>

    <div id="two">
    </div>

    <div id="three">
        <p>Homeward bound</p>
    </div>

    <div id="four">
    </div>

    <div id="five">
    </div>


</body>
</html>
